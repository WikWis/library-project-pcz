services:

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "4321:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5111:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=database;Database=AppDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"
    depends_on:
      - database

  database:
    container_name: database
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

volumes:
  sql-data:
